name: Fork - Sync upstream release

# Checks humanmade/S3-Uploads for a new release once a day. When there is one,
# runs .fork/sync.sh, builds and checks the result, and opens a PR.
# Merging that PR releases <upstream-version>.1 (see fork-release.yml).
#
# Token: PRs opened with the default GITHUB_TOKEN don't trigger other
# workflows, so fork-ci.yml won't run on them (the same checks still run in
# this job first). To get CI on sync PRs, add a FORK_SYNC_TOKEN secret: a
# fine-grained PAT or GitHub App token with contents and pull-requests write
# access on this repository.
# With GITHUB_TOKEN, also enable Settings > Actions > General >
# "Allow GitHub Actions to create and approve pull requests".

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Upstream tag to sync (default: the latest upstream release). An explicit tag skips the "newer than last sync" check.'
        required: false

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: fork-sync

env:
  UPSTREAM_REPO: humanmade/S3-Uploads
  BASE_BRANCH: master

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.FORK_SYNC_TOKEN || github.token }}

      # GitHub disables scheduled workflows after 60 days without repository
      # activity. Re-enabling it on each run is meant to keep the schedule alive.
      - name: Keep the schedule enabled
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/fork-sync.yml/enable"

      - name: Decide what to sync
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"

          if [ -n "${INPUT_TAG}" ]; then
            tag="${INPUT_TAG}"
          else
            tag="$(gh api "repos/${UPSTREAM_REPO}/releases/latest" --jq .tag_name)"
          fi
          base="${tag#v}"
          echo "Upstream tag: ${tag}"

          if ! [[ "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::warning::Upstream tag '${tag}' is not X.Y.Z; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          fork_tags="$(git ls-remote --tags --refs origin | sed 's#.*refs/tags/##')"
          if grep -qE "^${base//./\\.}\.[0-9]+$" <<< "$fork_tags"; then
            echo "Already released as $(grep -E "^${base//./\\.}\.[0-9]+$" <<< "$fork_tags" | sort -V | tail -1). Nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          if git ls-remote --exit-code --heads origin "sync/upstream-${tag}" > /dev/null; then
            echo "Branch sync/upstream-${tag} already exists (sync PR pending). Nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # Don't go backwards (upstream also releases backports for older
          # lines). Compare against the newest upstream version the fork has
          # released, ignoring fork tags that don't map to an upstream tag.
          upstream_tags="$(git ls-remote --tags --refs upstream | sed 's#.*refs/tags/##; s/^v//')"
          synced="$(grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' <<< "$fork_tags" | sed -E 's/\.[0-9]+$//' | sort -u || true)"
          last="$(comm -12 <(sort -u <<< "$synced") <(sort -u <<< "$upstream_tags") | sort -V | tail -1)"
          if [ -z "${INPUT_TAG}" ] && [ -n "$last" ] && [ "$(printf '%s\n%s\n' "$last" "$base" | sort -V | tail -1)" != "$base" ]; then
            echo "Upstream ${tag} is not newer than the last synced version ${last}. Nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          {
            echo "skip=false"
            echo "tag=${tag}"
            echo "version=${base}.1"
            echo "last=${last}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up PHP
        if: steps.plan.outputs.skip == 'false'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, mysqli, zip
          tools: composer, wp-cli
          coverage: none

      - name: Create sync branch
        if: steps.plan.outputs.skip == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash .fork/sync.sh "${{ steps.plan.outputs.tag }}"

      # Checks run here too, so a broken sync is visible in the PR even
      # when fork-ci.yml doesn't run on it (see the token note at the top).
      - name: Build and check
        if: steps.plan.outputs.skip == 'false'
        id: checks
        run: |
          set -uo pipefail
          status=0
          run() {
            echo "::group::$1"
            if bash -c "$2" > >(tee -a checks.log) 2>&1; then
              echo "- [x] $1" >> summary.md
            else
              echo "- [ ] **$1 FAILED**" >> summary.md
              status=1
            fi
            echo "::endgroup::"
          }
          run "composer install (Strauss build)" "composer install --no-interaction --no-progress --ignore-platform-reqs"
          run "No unprefixed dependency references" "php .fork/check-prefixes.php"
          run "Smoke test (prefixed build alone)" "php .fork/smoke-test.php"
          run "Smoke test (alongside an unprefixed AWS SDK)" "php .fork/smoke-test.php --with-unprefixed-sdk"
          run "Psalm" "php -d memory_limit=-1 vendor/bin/psalm --no-progress"
          run "PHPUnit (upstream suite)" "bash .fork/run-tests.sh"
          run "End-to-end: built zip in WordPress, WP-CLI commands, another plugin's AWS SDK" "bash .fork/e2e/ci.sh"
          echo "ok=$([ $status -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        if: steps.plan.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN || github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
          VERSION: ${{ steps.plan.outputs.version }}
          LAST: ${{ steps.plan.outputs.last }}
          OK: ${{ steps.checks.outputs.ok }}
        run: |
          set -euo pipefail
          branch="sync/upstream-${TAG}"
          git push origin "$branch"

          notes="$(gh api "repos/${UPSTREAM_REPO}/releases/tags/${TAG}" --jq .body 2>/dev/null || true)"
          {
            echo "Brings upstream [${TAG}](https://github.com/${UPSTREAM_REPO}/releases/tag/${TAG}) into the fork. Merging releases **${VERSION}**."
            echo
            if [ -n "$LAST" ]; then
              echo "Upstream changes: https://github.com/${UPSTREAM_REPO}/compare/${LAST}...${TAG}"
              echo
            fi
            echo "### Checks run by the sync job"
            cat summary.md
            echo
            if [ "$OK" != "true" ]; then
              echo "> [!WARNING]"
              echo "> Some checks failed, so this PR is a draft. Fix the overlay in \`.fork/\` on this branch (see \`.fork/README.md\`), or re-run the sync after fixing it on master."
              echo
            fi
            echo "### Review"
            echo "- [ ] Upstream changes don't need new overlay rules (new dependencies, new \`Aws\\\\\` references the guard can't see, changes to \`s3-uploads.php\`)."
            echo "- [ ] CI is green."
            echo
            echo "<details><summary>Upstream release notes</summary>"
            echo
            echo "${notes:-_No release notes._}"
            echo
            echo "</details>"
            echo
            echo "_Opened by the [Fork - Sync upstream release](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) workflow._"
          } > pr-body.md

          draft=()
          [ "$OK" = "true" ] || draft=(--draft)
          gh pr create --base "$BASE_BRANCH" --head "$branch" \
            --title "Sync upstream ${TAG} (release ${VERSION})" \
            --body-file pr-body.md "${draft[@]}"
